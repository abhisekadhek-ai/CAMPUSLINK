
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login — CampusLink</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
            overflow-x: hidden;
        }

        .landing {
            width: 100%;
            max-width: 460px;
            margin: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .brand {
            color: var(--indigo, #4f46e5);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        #title {
            margin: 0;
            text-align: center;
            font-size: clamp(30px, 6vw, 44px);
        }

        .tag-line {
            max-width: 100%;
            margin: 18px 0 28px;
            text-align: center;
            line-height: 1.6;
        }

        .panel {
            width: 100%;
            max-width: 420px;
            padding: 28px;
            margin: 0 auto;
            border-radius: 14px;
            text-align: left;
            background: var(--panel, rgba(255, 255, 255, 0.72));
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
        }

        .field {
            width: 100%;
            margin-bottom: 20px;
        }

        .field label {
            display: block;
            margin-bottom: 9px;
            font-size: 14px;
            font-weight: 500;
        }

        .field input {
            display: block;
            width: 100%;
            min-width: 0;
            height: 54px;
            padding: 12px 14px;
            border: 1px solid #cbd0d8;
            border-radius: 9px;
            background: #fff;
            color: #20242b;
            font-size: 16px;
            outline: none;
        }

        .field input:focus {
            border-color: var(--indigo, #4f46e5);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }

        #loginBtn {
            display: block;
            width: 100%;
            min-height: 52px;
            padding: 12px;
            border: none;
            border-radius: 9px;
            cursor: pointer;
            font-size: 16px;
        }

        #loginBtn:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        #msg {
            margin-bottom: 14px;
            overflow-wrap: anywhere;
        }

        #msg:empty {
            display: none;
        }

        .message {
            padding: 11px 12px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
        }

        .message.error {
            color: #991b1b;
            background: #fee2e2;
        }

        .message.success {
            color: #166534;
            background: #dcfce7;
        }

        .back-link {
            margin-top: 22px;
            font-size: 13.5px;
            text-align: center;
        }

        .back-link a {
            text-decoration: none;
        }

        @media (max-width: 480px) {
            body {
                padding: 20px 14px;
            }

            .panel {
                padding: 22px 18px;
            }

            .tag-line {
                margin-bottom: 22px;
            }
        }
    </style>
</head>

<body>
    <main class="landing">

        <div class="brand">CAMPUSLINK</div>

        <h1 id="title">Login</h1>

        <p class="tag-line" id="subtitle"></p>

        <section class="panel">

            <div id="msg" aria-live="polite"></div>

            <!-- Student ID field: shown only for student login -->
            <div class="field" id="studentRow" hidden>
                <label for="studentId">Student ID</label>

                <input
                    id="studentId"
                    type="text"
                    inputmode="numeric"
                    autocomplete="off"
                    list="studentIdOptions"
                    placeholder="Type or select your Student ID"
                    aria-describedby="studentHelp"
                >

                <datalist id="studentIdOptions"></datalist>

                <small id="studentHelp">
                    Type your Student ID to search. Only IDs are displayed.
                </small>
            </div>

            <div class="field">
                <label for="password">Password</label>

                <input
                    id="password"
                    type="password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button id="loginBtn" type="button">
                Log in
            </button>

        </section>

        <p class="back-link">
            <a href="index.html" class="muted">
                &larr; Back to all portals
            </a>
        </p>

    </main>

    <!-- Load your existing authentication and API functions -->
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>

    <script>
        const CONFIG = {
            student: {
                title: "Student login",
                subtitle: "See your readiness score, AI role matches and skill gaps."
            },
            recruiter: {
                title: "Recruiter login",
                subtitle: "Post roles and review your candidate pool."
            },
            admin: {
                title: "Admin login",
                subtitle: "Placement cell: drives, offers and analytics."
            }
        };

        const role = new URLSearchParams(
            window.location.search
        ).get("role");

        if (!CONFIG[role]) {
            window.location.replace("index.html");
        } else {
            document.getElementById("title").textContent =
                CONFIG[role].title;

            document.getElementById("subtitle").textContent =
                CONFIG[role].subtitle;

            document.title = CONFIG[role].title + " — CampusLink";
        }

        const msg = document.getElementById("msg");
        const studentRow = document.getElementById("studentRow");
        const studentIdInput = document.getElementById("studentId");
        const studentIdOptions = document.getElementById("studentIdOptions");
        const passwordInput = document.getElementById("password");
        const loginBtn = document.getElementById("loginBtn");

        let students = [];

        function showMessage(message, type = "error") {
            msg.replaceChildren();

            const box = document.createElement("div");
            box.className = "message " + type;
            box.textContent = message;

            msg.appendChild(box);
        }

        // Load the existing student IDs from your backend.
        async function loadStudents() {
            studentRow.hidden = false;
            studentIdInput.disabled = true;
            studentIdInput.placeholder = "Loading Student IDs...";

            try {
                const data = await apiGet("/auth/students");

                if (!Array.isArray(data)) {
                    throw new Error(
                        "The student list API did not return a list."
                    );
                }

                students = data
                    .filter(s =>
                        s &&
                        s.id !== undefined &&
                        s.id !== null &&
                        String(s.id).trim() !== ""
                    )
                    .sort((a, b) => Number(a.id) - Number(b.id));

                // Show IDs only, not student names.
                studentIdOptions.replaceChildren();

                students.forEach(student => {
                    const option = document.createElement("option");
                    option.value = String(student.id);
                    studentIdOptions.appendChild(option);
                });

                if (students.length === 0) {
                    showMessage("No Student IDs were returned by the backend.");
                } else {
                    studentIdInput.placeholder =
                        "Type or select your Student ID";
                }

            } catch (error) {
                console.error("Could not load Student IDs:", error);

                showMessage(
                    "Could not load Student IDs. Check that the backend is running and /auth/students works."
                );
            } finally {
                studentIdInput.disabled = false;
            }
        }

        // Run only for student login.
        if (role === "student") {
            loadStudents();
        }

        async function doLogin() {
            msg.replaceChildren();

            const password = passwordInput.value;

            if (!password) {
                showMessage("Please enter your password.");
                passwordInput.focus();
                return;
            }

            const body = {
                role: role,
                password: password
            };

            if (role === "student") {
                const enteredId = studentIdInput.value.trim();

                if (!enteredId) {
                    showMessage("Please enter your Student ID.");
                    studentIdInput.focus();
                    return;
                }

                // Accept only an ID present in the loaded student list.
                const selectedStudent = students.find(
                    student => String(student.id) === enteredId
                );

                if (!selectedStudent) {
                    showMessage(
                        "Student ID not found. Please type or select a valid ID."
                    );
                    studentIdInput.focus();
                    return;
                }

                body.student_id = Number(selectedStudent.id);
            }

            loginBtn.disabled = true;
            loginBtn.textContent = "Logging in...";

            try {
                const res = await apiPost("/auth/login", body);

                if (!res || !res.token || !res.role) {
                    throw new Error("The backend returned an invalid login response.");
                }

                saveSession({
                    role: res.role,
                    token: res.token,
                    studentId: res.student_id,
                    studentName: res.name
                });

                const destination = ROLE_HOME[role];

                if (!destination) {
                    throw new Error("The dashboard page is not configured.");
                }

                window.location.href = destination;

            } catch (error) {
                console.error("Login error:", error);

                const errorText = String(error.message || error);

                if (errorText.includes("401")) {
                    showMessage("Wrong password. Please try again.");
                } else if (errorText.includes("404")) {
                    showMessage("Student ID was not found in the database.");
                } else if (errorText.includes("400")) {
                    showMessage("Please check your login details.");
                } else {
                    showMessage(
                        "Login failed. Check the backend terminal for the exact error."
                    );
                }
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = "Log in";
            }
        }

        loginBtn.addEventListener("click", doLogin);

        passwordInput.addEventListener("keydown", event => {
            if (event.key === "Enter") {
                doLogin();
            }
        });

        studentIdInput.addEventListener("keydown", event => {
            if (event.key === "Enter") {
                passwordInput.focus();
            }
        });
    </script>
</body>
</html>
