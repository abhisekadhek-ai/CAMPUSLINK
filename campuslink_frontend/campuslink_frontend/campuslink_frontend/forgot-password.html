<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password — CampusLink</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
        }

        .forgot-container {
            width: 100%;
            max-width: 460px;
            text-align: center;
        }

        .brand {
            color: var(--indigo, #4f46e5);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0 0 12px;
            color: var(--indigo, #4f46e5);
        }

        .subtitle {
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .panel {
            width: 100%;
            padding: 28px;
            border-radius: 14px;
            text-align: left;
            background: var(--panel, rgba(255, 255, 255, 0.72));
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
        }

        input {
            width: 100%;
            height: 52px;
            padding: 12px 14px;
            border: 1px solid #cbd0d8;
            border-radius: 9px;
            background: #fff;
            color: #20242b;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: var(--indigo, #4f46e5);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }

        button {
            width: 100%;
            min-height: 52px;
            border: none;
            border-radius: 9px;
            cursor: pointer;
            font-size: 16px;
        }

        button:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        #msg {
            margin-bottom: 14px;
        }

        .message {
            padding: 11px 12px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
        }

        .message.error {
            color: #991b1b;
            background: #fee2e2;
        }

        .message.success {
            color: #166534;
            background: #dcfce7;
        }

        .back-link {
            margin-top: 22px;
            text-align: center;
            font-size: 14px;
        }

        .back-link a {
            text-decoration: none;
        }
    </style>
</head>

<body>

    <main class="forgot-container">

        <div class="brand">CAMPUSLINK</div>

        <h1>Forgot Password?</h1>

        <p class="subtitle">
            Enter your registered email address to receive an OTP.
        </p>

        <section class="panel">

            <div id="msg"></div>

            <div class="field">
                <label for="email">Registered Email</label>

                <input
                    id="email"
                    type="email"
                    placeholder="Enter your registered email"
                    autocomplete="email"
                    required
                >
            </div>

            <button id="sendOtpBtn" type="button">
                Send OTP
            </button>

        </section>

        <p class="back-link">
            <a href="login.html">
                &larr; Back to login
            </a>
        </p>

    </main>

    <script src="js/api.js"></script>

    <script>
        const emailInput = document.getElementById("email");
        const sendOtpBtn = document.getElementById("sendOtpBtn");
        const msg = document.getElementById("msg");

        function showMessage(message, type = "error") {
            msg.replaceChildren();

            const box = document.createElement("div");
            box.className = "message " + type;
            box.textContent = message;

            msg.appendChild(box);
        }

        async function sendOtp() {

            msg.replaceChildren();

            const email = emailInput.value.trim().toLowerCase();

            if (!email) {
                showMessage("Please enter your registered email.");
                emailInput.focus();
                return;
            }

            sendOtpBtn.disabled = true;
            sendOtpBtn.textContent = "Sending...";

            try {

                const response = await apiPost(
                    "/auth/forgot-password",
                    {
                        email: email
                    }
                );

                showMessage(
                    response.message || "OTP sent to your registered email.",
                    "success"
                );

                sessionStorage.setItem(
                    "campuslink_reset_email",
                    email
                );

                setTimeout(() => {
                    window.location.href = "reset-password.html";
                }, 1000);

            } catch (error) {

                console.error("Forgot password error:", error);

                showMessage(
                    error.message || "Could not send OTP."
                );

            } finally {

                sendOtpBtn.disabled = false;
                sendOtpBtn.textContent = "Send OTP";
            }
        }

        sendOtpBtn.addEventListener("click", sendOtp);

        emailInput.addEventListener("keydown", event => {
            if (event.key === "Enter") {
                sendOtp();
            }
        });
    </script>

</body>
</html>
