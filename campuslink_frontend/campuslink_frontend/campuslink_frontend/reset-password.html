<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password — CampusLink</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
        }

        .reset-container {
            width: 100%;
            max-width: 460px;
            text-align: center;
        }

        .brand {
            color: var(--indigo, #4f46e5);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0 0 12px;
            color: var(--indigo, #4f46e5);
        }

        .subtitle {
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .panel {
            width: 100%;
            padding: 28px;
            border-radius: 14px;
            text-align: left;
            background: var(--panel, rgba(255, 255, 255, 0.72));
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
        }

        input {
            width: 100%;
            height: 52px;
            padding: 12px 14px;
            border: 1px solid #cbd0d8;
            border-radius: 9px;
            background: #fff;
            color: #20242b;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: var(--indigo, #4f46e5);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }

        button {
            width: 100%;
            min-height: 52px;
            border: none;
            border-radius: 9px;
            cursor: pointer;
            font-size: 16px;
        }

        button:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        #msg {
            margin-bottom: 14px;
        }

        .message {
            padding: 11px 12px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
        }

        .message.error {
            color: #991b1b;
            background: #fee2e2;
        }

        .message.success {
            color: #166534;
            background: #dcfce7;
        }

        .back-link {
            margin-top: 22px;
            text-align: center;
            font-size: 14px;
        }

        .back-link a {
            text-decoration: none;
        }
    </style>
</head>

<body>

    <main class="reset-container">

        <div class="brand">CAMPUSLINK</div>

        <h1>Reset Password</h1>

        <p class="subtitle">
            Enter the OTP sent to your registered email and create a new password.
        </p>

        <section class="panel">

            <div id="msg"></div>

            <div class="field">
                <label for="otp">OTP</label>

                <input
                    id="otp"
                    type="text"
                    inputmode="numeric"
                    maxlength="6"
                    placeholder="Enter 6-digit OTP"
                    autocomplete="one-time-code"
                    required
                >
            </div>

            <div class="field">
                <label for="newPassword">New Password</label>

                <input
                    id="newPassword"
                    type="password"
                    placeholder="Enter new password"
                    autocomplete="new-password"
                    required
                >
            </div>

            <button id="resetBtn" type="button">
                Reset Password
            </button>

        </section>

        <p class="back-link">
            <a href="login.html">
                &larr; Back to login
            </a>
        </p>

    </main>

    <script src="js/api.js"></script>

    <script>
        const email = sessionStorage.getItem("campuslink_reset_email");

        const otpInput = document.getElementById("otp");
        const newPasswordInput = document.getElementById("newPassword");
        const resetBtn = document.getElementById("resetBtn");
        const msg = document.getElementById("msg");

        function showMessage(message, type = "error") {
            msg.replaceChildren();

            const box = document.createElement("div");
            box.className = "message " + type;
            box.textContent = message;

            msg.appendChild(box);
        }

        if (!email) {
            showMessage(
                "Reset session not found. Please request a new OTP."
            );

            resetBtn.disabled = true;
        }

        async function resetPassword() {

            msg.replaceChildren();

            const otpText = otpInput.value.trim();
            const newPassword = newPasswordInput.value;

            if (!otpText) {
                showMessage("Please enter the OTP.");
                otpInput.focus();
                return;
            }

            if (!/^\d{6}$/.test(otpText)) {
                showMessage("OTP must be exactly 6 digits.");
                otpInput.focus();
                return;
            }

            if (!newPassword) {
                showMessage("Please enter a new password.");
                newPasswordInput.focus();
                return;
            }

            resetBtn.disabled = true;
            resetBtn.textContent = "Resetting...";

            try {

                const response = await apiPost(
                    "/auth/verify-reset-otp",
                    {
                        email: email,
                        otp: Number(otpText),
                        new_password: newPassword
                    }
                );

                showMessage(
                    response.message ||
                    "Password reset successfully. You can now login.",
                    "success"
                );

                sessionStorage.removeItem("campuslink_reset_email");

                setTimeout(() => {
                    window.location.href = "login.html";
                }, 1500);

            } catch (error) {

                console.error("Password reset error:", error);

                showMessage(
                    error.message ||
                    "Invalid or expired OTP."
                );

            } finally {

                resetBtn.disabled = false;
                resetBtn.textContent = "Reset Password";
            }
        }

        resetBtn.addEventListener("click", resetPassword);

        newPasswordInput.addEventListener("keydown", event => {
            if (event.key === "Enter") {
                resetPassword();
            }
        });
    </script>

</body>
</html>
