<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login — CampusLink</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
            overflow-x: hidden;
        }

        .landing {
            width: 100%;
            max-width: 460px;
            margin: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .brand {
            color: var(--indigo, #4f46e5);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        #title {
            margin: 0;
            text-align: center;
            font-size: clamp(30px, 6vw, 44px);
        }

        .tag-line {
            max-width: 100%;
            margin: 18px 0 28px;
            text-align: center;
            line-height: 1.6;
        }

        .panel {
            width: 100%;
            max-width: 420px;
            padding: 28px;
            margin: 0 auto;
            border-radius: 14px;
            text-align: left;
            background: var(--panel, rgba(255, 255, 255, 0.72));
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
        }

        .field {
            width: 100%;
            margin-bottom: 20px;
        }

        .field label {
            display: block;
            margin-bottom: 9px;
            font-size: 14px;
            font-weight: 500;
        }

        .field input {
            display: block;
            width: 100%;
            min-width: 0;
            height: 54px;
            padding: 12px 14px;
            border: 1px solid #cbd0d8;
            border-radius: 9px;
            background: #fff;
            color: #20242b;
            font-size: 16px;
            outline: none;
        }

        .field input:focus {
            border-color: var(--indigo, #4f46e5);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }

        #loginBtn {
            display: block;
            width: 100%;
            min-height: 52px;
            padding: 12px;
            border: none;
            border-radius: 9px;
            cursor: pointer;
            font-size: 16px;
        }

        #loginBtn:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        #msg {
            margin-bottom: 14px;
            overflow-wrap: anywhere;
        }

        #msg:empty {
            display: none;
        }

        .message {
            padding: 11px 12px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
        }

        .message.error {
            color: #991b1b;
            background: #fee2e2;
        }

        .message.success {
            color: #166534;
            background: #dcfce7;
        }

        .back-link {
            margin-top: 22px;
            font-size: 13.5px;
            text-align: center;
        }

        .back-link a {
            text-decoration: none;
        }

        .forgot-password {
            margin: 14px 0 0;
            text-align: center;
            font-size: 14px;
        }

        .forgot-password a {
            color: var(--indigo, #4f46e5);
            text-decoration: none;
            font-weight: 500;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        /* Recruiter Sign Up */

        #recruiterSignup {
            margin: 14px 0 0;
            text-align: center;
            font-size: 14px;
        }

        #recruiterSignup a {
            color: var(--indigo, #4f46e5);
            text-decoration: none;
            font-weight: 600;
        }

        #recruiterSignup a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {

            body {
                padding: 20px 14px;
            }

            .panel {
                padding: 22px 18px;
            }

            .tag-line {
                margin-bottom: 22px;
            }

        }

    </style>
    </head>


<body>


    <main class="landing">


        <div class="brand">CAMPUSLINK</div>


        <h1 id="title">Login</h1>


        <p class="tag-line" id="subtitle"></p>


        <section class="panel">


            <div id="msg" aria-live="polite"></div>


            <!-- Recruiter Email -->

            <!-- Recruiter Email -->
            <div class="field" id="emailRow" hidden>
                <label for="email">Recruiter Email / Company / Shortcut</label>
                <input
                    id="email"
                    type="text"
                    placeholder="e.g. tcs@campuslink.com, google@campuslink.com, amazon@campuslink.com"
                    autocomplete="username"
                >
            </div>


            <!-- Student ID -->

            <div class="field" id="studentRow" hidden>

                <label for="studentId">Student ID</label>

                <input
                    id="studentId"
                    type="text"
                    inputmode="numeric"
                    autocomplete="off"
                    list="studentIdOptions"
                    placeholder="Type or select your Student ID"
                    aria-describedby="studentHelp"
                >

                <datalist id="studentIdOptions"></datalist>

                <small id="studentHelp">
                    Type your Student ID to search. Only IDs are displayed.
                </small>

            </div>


            <!-- College Placement ID -->

            <div class="field" id="collegeRow" hidden>

                <label for="collegeId">College ID / Name / Email</label>

                <input
                    id="collegeId"
                    type="text"
                    placeholder="Enter College ID (e.g. COL0002), Name (e.g. KIT), or Email"
                    autocomplete="username"
                >

            </div>


            <!-- Password -->

            <div class="field">

                <label for="password">Password</label>

                <input
                    id="password"
                    type="password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <!-- Login Button -->

            <button id="loginBtn" type="button">
                Log in
            </button>


            <!-- Recruiter Sign Up -->

            <p id="recruiterSignup" style="display: none;">

                New recruiter?

                <a href="recruiter-signup.html">
                    Sign Up
                </a>

            </p>
            <!-- College Sign Up -->
<p id="collegeSignup" style="display: none;">

    New college?

    <a href="college-signup.html">
        Sign Up
    </a>

</p>


            <!-- Forgot Password -->

            <p class="forgot-password">

                <a href="forgot-password.html">
                    Forgot Password?
                </a>

            </p>


        </section>


        <p class="back-link">

            <a href="index.html" class="muted">
                &larr; Back to all portals
            </a>

        </p>


    </main>


    <!-- Existing files -->

    <script src="js/auth.js"></script>

    <script src="js/api.js"></script>


    <script>

        const CONFIG = {

            student: {

                title: "Student login",

                subtitle:
                    "See your readiness score, AI role matches and skill gaps."

            },


            recruiter: {

                title: "Recruiter login",

                subtitle:
                    "Post roles and review your candidate pool."

            },


            college: {

                title: "College Placement login",

                subtitle:
                    "Manage students, approve applications and support placement activities."

            }

        };


        // Get selected role from URL

        const role = new URLSearchParams(
            window.location.search
        ).get("role");


        // Check role

        if (!CONFIG[role]) {

            window.location.replace("index.html");

        } else {

            document.getElementById("title").textContent =
                CONFIG[role].title;

            document.getElementById("subtitle").textContent =
                CONFIG[role].subtitle;

            document.title =
                CONFIG[role].title + " — CampusLink";

        }


        // Elements

        const msg =
            document.getElementById("msg");


        const emailRow =
            document.getElementById("emailRow");


        const emailInput =
            document.getElementById("email");


        const studentRow =
            document.getElementById("studentRow");


        const studentIdInput =
            document.getElementById("studentId");


        const studentIdOptions =
            document.getElementById("studentIdOptions");


        // College Placement elements

        const collegeRow =
            document.getElementById("collegeRow");


        const collegeIdInput =
            document.getElementById("collegeId");


        const passwordInput =
            document.getElementById("password");


        const loginBtn =
            document.getElementById("loginBtn");


        const recruiterSignup =
    document.getElementById("recruiterSignup");

const collegeSignup =
    document.getElementById("collegeSignup");


let students = [];
        // Display message
        function showMessage(message, type = "error", allowHtml = false) {
            msg.replaceChildren();
            const box = document.createElement("div");
            box.className = "message " + type;
            if (allowHtml) {
                box.innerHTML = message;
            } else {
                box.textContent = message;
            }
            msg.appendChild(box);
        }

        function showNetworkErrorBox(currentUrl) {
            msg.replaceChildren();
            const box = document.createElement("div");
            box.className = "message error";
            box.innerHTML = `
                <div><strong>Cannot connect to CampusLink Backend</strong> at <code>${currentUrl}</code>.</div>
                <div style="margin-top: 6px; font-size: 13px;">If you are accessing from another system, enter the server's IP address:</div>
                <div style="display: flex; gap: 8px; margin-top: 8px;">
                    <input id="serverIpInput" type="text" placeholder="http://192.168.1.5:8000" value="${currentUrl}" style="flex:1; padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; color: #1e293b;">
                    <button id="saveServerIpBtn" type="button" style="padding: 6px 12px; background: #4f46e5; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500;">Save & Retry</button>
                </div>
            `;
            msg.appendChild(box);

            const btn = document.getElementById("saveServerIpBtn");
            const input = document.getElementById("serverIpInput");
            if (btn && input) {
                btn.onclick = () => {
                    const newUrl = input.value.trim();
                    if (newUrl) {
                        setCampusLinkBaseUrl(newUrl);
                        showMessage("Server updated to " + BASE_URL + ". Retrying login...", "success");
                        setTimeout(() => doLogin(), 400);
                    }
                };
            }
        }

        // -------------------------------------------------
        // Recruiter login -> show Email + Sign Up
        // -------------------------------------------------

        if (role === "recruiter") {
            emailRow.hidden = false;
            emailInput.required = true;
            recruiterSignup.style.display = "block";

            emailInput.focus();
        }


        // -------------------------------------------------
        // College Placement login -> show College ID
        // -------------------------------------------------

        if (role === "college") {

    collegeRow.hidden = false;

    collegeIdInput.required = true;

    collegeSignup.style.display = "block";

    collegeIdInput.focus();

}


        // -------------------------------------------------
        // Student login -> load Student IDs
        // -------------------------------------------------

        async function loadStudents() {

            studentRow.hidden = false;

            studentIdInput.disabled = true;

            studentIdInput.placeholder =
                "Loading Student IDs...";

            try {

                const data =
                    await apiGet("/auth/students");

                if (!Array.isArray(data)) {

                    throw new Error(
                        "The student list API did not return a list."
                    );

                }


                students = data

                    .filter(student =>
                        student &&
                        student.id !== undefined &&
                        student.id !== null &&
                        String(student.id).trim() !== ""
                    )

                    .sort(
                        (a, b) =>
                            Number(a.id) - Number(b.id)
                    );


                studentIdOptions.replaceChildren();


                students.forEach(student => {

                    const option =
                        document.createElement("option");

                    option.value =
                        String(student.id);

                    studentIdOptions.appendChild(option);

                });


                if (students.length === 0) {

                    showMessage(
                        "No Student IDs were returned by the backend."
                    );

                } else {

                    studentIdInput.placeholder =
                        "Type or select your Student ID";

                }


            } catch (error) {

                console.error(
                    "Could not load Student IDs:",
                    error
                );

                showMessage(
                    "Could not load Student IDs. Check that the backend is running."
                );

            } finally {

                studentIdInput.disabled = false;

            }

        }


        if (role === "student") {

            loadStudents();

        }


        // -------------------------------------------------
        // LOGIN
        // -------------------------------------------------

        async function doLogin() {

            msg.replaceChildren();


            const password =
                passwordInput.value.trim();


            // Password validation

            if (!password) {

                showMessage(
                    "Please enter your password."
                );

                passwordInput.focus();

                return;

            }


            // Base request

            const body = {

                role: role,

                password: password

            };


        // -------------------------------------------------
        // RECRUITER
        // -------------------------------------------------

            if (role === "recruiter") {
                const email = emailInput.value.trim();

                if (!email) {
                    showMessage("Please enter your recruiter email, company name, or 'recruiter'.");
                    emailInput.focus();
                    return;
                }

                body.email = email;
            }


        // -------------------------------------------------
        // STUDENT
        // -------------------------------------------------

            if (role === "student") {

                const enteredId =
                    studentIdInput.value.trim();


                if (!enteredId) {

                    showMessage(
                        "Please enter your Student ID."
                    );

                    studentIdInput.focus();

                    return;

                }


                const selectedStudent =
                    students.find(
                        student =>
                            String(student.id) === enteredId
                    );


                if (!selectedStudent) {

                    showMessage(
                        "Student ID not found. Please type or select a valid ID."
                    );

                    studentIdInput.focus();

                    return;

                }


                body.student_id =
                    Number(selectedStudent.id);

            }


        // -------------------------------------------------
        // COLLEGE PLACEMENT
        // -------------------------------------------------

            if (role === "college") {

                const collegeId =
                    collegeIdInput.value.trim();


                if (!collegeId) {

                    showMessage(
                        "Please enter your College ID, College Name, or Email."
                    );

                    collegeIdInput.focus();

                    return;

                }


                body.college_id = collegeId;
                if (collegeId.includes("@")) {
                    body.email = collegeId;
                }

            }


        // -------------------------------------------------
        // SEND LOGIN REQUEST
        // -------------------------------------------------

            loginBtn.disabled = true;

            loginBtn.textContent =
                "Logging in...";


            try {

                console.log(
                    "Login request:",
                    {
                        role: body.role,
                        email: body.email || null,
                        student_id: body.student_id || null,
                        college_id: body.college_id || null
                    }
                );


                const res =
                    await apiPost(
                        "/auth/login",
                        body
                    );


                console.log(
                    "Login response:",
                    res
                );


                if (
                    !res ||
                    !res.token ||
                    !res.role
                ) {

                    throw new Error(
                        "The backend returned an invalid login response."
                    );

                }


                // Save session

                saveSession({
                    role: res.role,
                    token: res.token,
                    studentId: res.student_id,
                    student_id: res.student_id,
                    studentName: res.name,
                    name: res.name,
                    recruiter_id: res.recruiter_id,
                    college_id: res.college_id,
                    college_code: res.college_code,
                    collegeName: res.college_name || res.name
                });


                showMessage(
                    "Login successful. Redirecting...",
                    "success"
                );


                // Dashboard

                const destination =
                    ROLE_HOME[role];


                if (!destination) {

                    throw new Error(
                        "The dashboard page is not configured."
                    );

                }


                setTimeout(() => {

                    window.location.href =
                        destination;

                }, 300);


            } catch (error) {
                console.error("Login error:", error);

                const errorText = String(error.message || error);
                const isNetwork =
                    error.isNetworkError ||
                    errorText.includes("Cannot connect") ||
                    errorText.includes("Failed to fetch") ||
                    errorText.includes("NetworkError");

                if (isNetwork) {
                    showNetworkErrorBox(BASE_URL);
                } else if (error.detail) {
                    showMessage(error.detail);
                } else if (errorText.includes("401") || errorText.toLowerCase().includes("wrong password")) {
                    showMessage("Invalid email, shortcut or password. Use demo credentials (recruiter@campuslink.com / recruiter123) or sign up.");
                } else if (errorText.includes("404")) {
                    showMessage(role === "college" ? "College account was not found." : "Account was not found.");
                } else if (errorText.includes("400")) {
                    showMessage(errorText.replace("/auth/login failed: 400", "").trim() || "Please check your login details.");
                } else {
                    showMessage(errorText || "Login failed. Check that the backend server is running.");
                }

            } finally {

                loginBtn.disabled = false;

                loginBtn.textContent =
                    "Log in";

            }

        }


        // Button click

        loginBtn.addEventListener(
            "click",
            doLogin
        );


        // Enter on password

        passwordInput.addEventListener(
            "keydown",
            event => {

                if (event.key === "Enter") {

                    doLogin();

                }

            }
        );


        // Enter on recruiter email

        emailInput.addEventListener(
            "keydown",
            event => {

                if (event.key === "Enter") {

                    passwordInput.focus();

                }

            }
        );


        // Enter on student ID

        studentIdInput.addEventListener(
            "keydown",
            event => {

                if (event.key === "Enter") {

                    passwordInput.focus();

                }

            }
        );


        // Enter on College ID

        collegeIdInput.addEventListener(
            "keydown",
            event => {

                if (event.key === "Enter") {

                    passwordInput.focus();

                }

            }
        );
                // -------------------------------------------------
        // END OF LOGIN SCRIPT
        // -------------------------------------------------

    </script>


    <script src="js/fx.js" defer></script>
    


</body>


</html>
